version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vulnmind-postgres
    environment:
      POSTGRES_USER: vulnmind
      POSTGRES_PASSWORD: vulnmind_password
      POSTGRES_DB: vulnmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vulnmind-backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://vulnmind:vulnmind_password@postgres:5432/vulnmind_db?schema=public
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
    restart: unless-stopped
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vulnmind-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
